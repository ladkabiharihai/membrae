<line x1="358" y1="372" x2="387" y2="358" stroke="#e8923a" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="358" y="418" text-anchor="middle" font-size="7.5" fill="#888">damped rotation (the "spin")</text>
</svg>